name: Release

on:
  push:
    tags:
      - '[0-9]+.[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Verify pom version matches tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          POM_VERSION=$(mvn -q -DforceStdout help:evaluate -Dexpression=project.version)
          echo "tag=$VERSION pom=$POM_VERSION"
          [ "$VERSION" = "$POM_VERSION" ] || { echo "::error::Tag $VERSION does not match pom version $POM_VERSION. Bump the pom in a release commit before tagging."; exit 1; }

      - name: Build with Maven
        run: mvn -B package --file pom.xml

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: target/EndlessDispense.jar
          generate_release_notes: true
          fail_on_unmatched_files: true
